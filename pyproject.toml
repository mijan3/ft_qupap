[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "ft-qupap-capstone"
version = "5.1.0"
description = "Fault-Tolerant Quantum Authentication Protocol with Post-Quantum Bootstrapping and Adaptive Eavesdropping Detection"
readme = "README.md"
requires-python = ">=3.10,<3.13"

authors = [
    { name = "FT-QuPAP Capstone Team" }
]

keywords = [
    "quantum-authentication",
    "post-quantum-cryptography",
    "ml-kem",
    "ml-dsa",
    "kmac",
    "steane-code",
    "gaussian-process",
    "qiskit"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering"
]

dependencies = [
    "numpy==1.26.4",
    "pandas>=2.1,<3.0",
    "scikit-learn>=1.4,<2.0",
    "joblib>=1.3,<2.0",
    "matplotlib>=3.8,<4.0",
    "pycryptodome>=3.20,<4.0",
    "cryptography>=42,<46",
    "pqcrypto>=0.3.4",
    "qiskit>=1.2,<3.0",
    "qiskit-aer>=0.15,<1.0",
    "streamlit>=1.37,<2.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyserial>=3.5,<4.0"
]


[project.optional-dependencies]
development = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0"
]


[project.urls]
Repository = "https://github.com/mijan3/ft-qupap-capstone"
Documentation = "https://github.com/mijan3/ft-qupap-capstone/tree/main/docs"


[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "dashboard*", "scenarios*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--strict-markers",
    "--disable-warnings"
]


[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "notebooks/*",
    "scripts/*"
]


[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]